<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumina — Interactive Digital Experience</title>
  <meta name="description" content="A realistic, interactive single-file website with advanced CSS gradients, glassmorphism, animations and effects." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #05050f;
      --bg-elevated: #0c0c1a;
      --text: #f0f0f8;
      --text-muted: #a0a0b8;
      --accent: #7c6fff;
      --accent-2: #ff6fb0;
      --accent-3: #22d3ee;
      --accent-4: #fbbf24;
      --glass: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.12);
      --radius: 20px;
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
      cursor: none;
    }

    /* Custom Cursor */
    .cursor {
      position: fixed;
      width: 12px;
      height: 12px;
      background: var(--accent);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      mix-blend-mode: difference;
      transition: transform 0.15s ease, width 0.2s, height 0.2s;
      transform: translate(-50%, -50%);
    }
    .cursor-follower {
      position: fixed;
      width: 40px;
      height: 40px;
      border: 1.5px solid rgba(124, 111, 255, 0.5);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transition: transform 0.25s ease, width 0.3s, height 0.3s, border-color 0.3s;
      transform: translate(-50%, -50%);
    }
    body:hover .cursor { opacity: 1; }
    .cursor.hover, .cursor-follower.hover {
      transform: translate(-50%, -50%) scale(1.8);
    }
    .cursor-follower.hover {
      border-color: var(--accent-2);
      width: 60px;
      height: 60px;
    }

    /* Scroll Progress */
    .scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent-3));
      width: 0%;
      z-index: 1000;
      transition: width 0.1s linear;
    }

    /* Background Orbs / Mesh */
    .bg-orbs {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -1;
      pointer-events: none;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.55;
      animation: float 18s ease-in-out infinite;
    }
    .orb-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
      top: -10%;
      left: -10%;
      animation-delay: 0s;
    }
    .orb-2 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, var(--accent-2) 0%, transparent 70%);
      top: 40%;
      right: -5%;
      animation-delay: -6s;
      animation-duration: 22s;
    }
    .orb-3 {
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, var(--accent-3) 0%, transparent 70%);
      bottom: 10%;
      left: 20%;
      animation-delay: -12s;
      animation-duration: 20s;
    }
    .orb-4 {
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, var(--accent-4) 0%, transparent 70%);
      top: 20%;
      left: 50%;
      animation-delay: -4s;
      animation-duration: 16s;
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(40px, -30px) scale(1.05); }
      50% { transform: translate(-20px, 40px) scale(0.95); }
      75% { transform: translate(30px, 20px) scale(1.02); }
    }

    /* Noise overlay for realism */
    .noise {
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 0;
    }

    /* Navigation */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: var(--transition);
    }
    nav.scrolled {
      background: rgba(5, 5, 15, 0.75);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--glass-border);
      padding: 0.9rem 2rem;
    }
    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.5rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }
    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }
    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      position: relative;
      transition: color var(--transition);
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width var(--transition);
    }
    .nav-links a:hover {
      color: var(--text);
    }
    .nav-links a:hover::after {
      width: 100%;
    }
    .nav-cta {
      padding: 0.6rem 1.4rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border: none;
      border-radius: 999px;
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition);
      box-shadow: 0 4px 20px rgba(124, 111, 255, 0.4);
    }
    .nav-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(124, 111, 255, 0.5);
    }
    .menu-toggle {
      display: none;
      flex-direction: column;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
    }
    .menu-toggle span {
      width: 24px;
      height: 2px;
      background: var(--text);
      transition: var(--transition);
    }

    /* Hero */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 6rem 1.5rem 4rem;
      position: relative;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 1rem;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      backdrop-filter: blur(10px);
      animation: fadeUp 0.8s ease both;
    }
    .hero-badge .dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    .hero h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -2px;
      margin-bottom: 1.5rem;
      animation: fadeUp 0.8s 0.15s ease both;
    }
    .hero h1 .gradient {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 45%, var(--accent-3) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      background-size: 200% auto;
      animation: shimmer 6s linear infinite;
    }
